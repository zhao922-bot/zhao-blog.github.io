<script async src="https://busuanzi.meuicat.com/js"></script>
<script>
  (function () {
    var box = document.getElementById('site-stats');
    var uv = document.getElementById('busuanzi_site_uv');
    var pv = document.getElementById('busuanzi_site_pv');
    if (!box || !uv || !pv) return;
    var tries = 0;
    var timer = setInterval(function () {
      tries += 1;
      if (/^\d+$/.test((uv.textContent || '').trim()) && /^\d+$/.test((pv.textContent || '').trim())) {
        box.hidden = false;
        clearInterval(timer);
      } else if (tries >= 20) {
        clearInterval(timer);
      }
    }, 300);
  }());
</script>
